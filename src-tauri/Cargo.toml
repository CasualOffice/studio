[package]
name = "melp-model-studio"
version = "0.1.0"
description = "Local image generation and editing on Apple Silicon"
authors = ["melp"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "melp_model_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
flate2 = "1"
tar = "0.4"

sysinfo = "0.33"

# --- vault ---
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
