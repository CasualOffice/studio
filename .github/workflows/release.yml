name: Release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  build:
    name: Build
    # Apple Silicon only: MLX has no other backend, and the vault's key
    # handling is macOS Keychain code. An Intel or Linux build is not a
    # missing target, it is an impossible one.
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Three manifests carry the version and nothing compared them with the
      # tag, so a tag pushed before the bump landed -- or with only two of the
      # three bumped -- built and published happily: the file name came from
      # the tag while the about box and the updater read tauri.conf.json.
      # Checked before anything is built, because nothing later in the run can
      # change the answer and the build takes twenty minutes to reach it.
      - name: Versions agree with the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          pkg=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json | head -1)
          conf=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          printf 'tag             %s\npackage.json    %s\ntauri.conf.json %s\nCargo.toml      %s\n' \
            "$want" "$pkg" "$conf" "$crate"
          if [ -z "$want" ] || [ "$pkg" != "$want" ] ||
             [ "$conf" != "$want" ] || [ "$crate" != "$want" ]; then
            echo "these must all agree before a release can be built"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # The runner's own python3 is Homebrew's and refuses pip installs under
      # PEP 668. CI uses this for the same reason.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-cargo-

      - run: npm ci

      # The same gates CI runs. A release that skips them is a release that
      # ships whatever happened to be on the branch.
      - name: Checks
        run: |
          npx tsc --noEmit
          npx vitest run
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --lib

      # Pinned to the same versions as CI and engine/requirements.lock. They
      # were unpinned here alone, which meant a tag push could go red for a
      # pillow or cryptography release that had nothing to do with the tagged
      # commit, on a commit CI had already passed against the pinned set.
      - name: Engine tests
        run: |
          python -m pip install --quiet pillow==12.3.0 pillow-heif==1.7.0 cryptography==50.0.1
          python engine/test_worker.py

      # The vault format check, the same script CI and preflight run. A release
      # that ships a host which seals differently than the engine opens makes
      # every file it writes unopenable, and that cannot be fixed by a later
      # release -- the bytes are already on disk.
      - name: Vault format interop
        run: python scripts/verify_vectors.py

      - name: Build
        run: npm run tauri build -- --bundles app,dmg

      # Ad-hoc signed, so macOS quarantines it on download. The instructions
      # in the release notes cover clearing that; naming the file plainly
      # helps people find the right one.
      - name: Name the artifacts
        id: pack
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The same expression the version guard checked, so the name and the
          # guard cannot disagree. This used to read GITHUB_REF_NAME first and
          # fall back to the dispatch input, but GITHUB_REF_NAME is always set
          # -- on a manual run it is the branch -- so the fallback never fired
          # and a workflow_dispatch build named its download after the branch,
          # ModelStudio-main-AppleSilicon.dmg.
          VERSION="${TAG#v}"
          OUT=src-tauri/target/release/bundle
          mkdir -p dist-release
          cp "$OUT"/dmg/*.dmg "dist-release/ModelStudio-${VERSION}-AppleSilicon.dmg"
          ditto -c -k --keepParent "$OUT/macos/Model Studio.app" \
            "dist-release/ModelStudio-${VERSION}-AppleSilicon.app.zip"
          # From inside the directory, so the file names in SHA256SUMS.txt are
          # bare. Hashing `dist-release/*` from the repository root embeds that
          # prefix, and then the command in the release notes --
          # `shasum -a 256 -c SHA256SUMS.txt` -- fails for everyone who
          # downloads the assets into a folder of their own.
          ( cd dist-release && shasum -a 256 ./*.dmg ./*.zip | sed 's| \./| |' > SHA256SUMS.txt )
          cat dist-release/SHA256SUMS.txt
          # Prove the instructions work before publishing them.
          ( cd dist-release && shasum -a 256 -c SHA256SUMS.txt )

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-release/*
          draft: true
          generate_release_notes: true
          body_path: .github/RELEASE_NOTES.md
