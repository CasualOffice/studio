name: CI

# Apple Silicon only: MLX has no other backend, and the vault's Keychain code
# is macOS-specific. A Linux runner could not build this even in principle.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow publishes anything, and with no block here every job
# ran on whatever the repository default happened to be. Where that default is
# write, it handed a write-scoped token to a pull request's own code. Declaring
# the scope here settles it regardless of the setting.
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        # Warnings are failures here: the codebase is currently at zero, and
        # the only way that stays true is if drift breaks the build.
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        # Not --lib. That skips every integration target, so the first test
        # anyone adds under src-tauri/tests/ would never have run here.
        run: cargo test

      # The examples are compiled by clippy --all-targets and were executed by
      # nothing, so vault_lifecycle sat broken at its third assertion -- a
      # non-UUID id that `put` rejects -- with every gate green. That probe is
      # the only coverage of dedup, orphan recovery, foreign-file
      # preservation, export, lock/unlock survival and change_passphrase, and
      # storage_move covers a relocation that deletes the originals once the
      # copy lands. Both are hermetic: temp directories, no network, no
      # Keychain. (keychain_probe and setup_probe are deliberately not here --
      # one touches the real Keychain, the other downloads a Python runtime.)
      - name: Probes
        working-directory: src-tauri
        run: |
          cargo run --quiet --example vault_lifecycle
          cargo run --quiet --example storage_move

  frontend:
    name: Frontend
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build

  engine:
    name: Engine
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Only what the tests touch. Installing mlx-gen would pull PyTorch and
      # several gigabytes of weights for tests that never load a model.
      - name: Install test dependencies
        run: python -m pip install --quiet pillow==12.3.0 pillow-heif==1.7.0 cryptography==50.0.1

      - name: Tests
        run: python engine/test_worker.py

  interop:
    name: Vault format interop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet cryptography==50.0.1

      # The Rust and Python implementations of the vault format must stay
      # byte-identical. Nothing else in the suite would catch them drifting.
      #
      # The comparison used to live here as a heredoc, which is why neither
      # preflight nor the release workflow ran it: there was nothing to call.
      # It is a script now, and all three run the same one.
      - name: Verify the Rust and Python vault formats match
        run: python scripts/verify_vectors.py
